[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "palladion"
version = "0.1.0"
description = "Evidence-first agent harness: deterministic foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.143.3",
    "fastembed==0.9.0",
    "httpx==0.28.1",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.2,<7",
    "qdrant-client==1.19.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1", "mypy>=1.18,<2", "types-PyYAML>=6,<7", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
