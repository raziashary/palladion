services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: palladion-p02-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - palladion-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  palladion-qdrant-data:
