services:
  neo4j:
    image: neo4j:2026.09.0-community
    profiles: ["graph"]
    ports:
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_server_http_enabled: "false"
      NEO4J_server_https_enabled: "false"
      NEO4J_server_fleet__discovery_enabled: "false"
      NEO4J_dbms_fleet__manager_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - palladion-neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "bolt://localhost:7687", "RETURN 1"]
      interval: 5s
      timeout: 3s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: palladion-p02-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - palladion-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  palladion-neo4j-data:
  palladion-qdrant-data:
