[project]
name = "palladion-benchmark"
version = "0.1.0"
description = "Retrieval and evidence-reliability benchmark for Palladion (development suite stage; no runtime code yet)."
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
