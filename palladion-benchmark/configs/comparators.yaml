# E0 is pinned by langchain-core and E1 by langgraph; the exact versions of the whole environment are in the run
# manifest (ComparatorPin.packages) and in scripts/comparators.py (BADR-0040).
# Palladion at caebd53 (P11: the evidence-path remediation of ADR-0102 to ADR-0111 on top of dd70c0e: packed chunks of 600 characters, exact codes and named versions, 20 reranked passages, long-lived search workers), the commit the isolated runtime of
# scripts/palladion_runtime.py checks out. Results recorded at 6444345, eec4ba5, dd70c0e and 5acc825 keep those pins (BADR-0038, BADR-0044, BADR-0046)
