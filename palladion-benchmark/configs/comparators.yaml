# Arm registry with pins. UNPINNED is allowed while exploring and refused in confirmatory mode.
# A real pin replaces it in the phase that builds the arm (commit, version, model or image_tag).
schema_version: "1.0"

# R4 to R6 are pinned to the commits the owner approved for download (OQ14, BADR-0031); scripts/comparators.py verifies them.
# R0 to R3 are the benchmark's own arms: their pin is the method version defined by the code in benchmark/adapters
# (B04-T01). A change to chunking, fusion or rerank depth is a new version.

arms:
  - {id: R0, name: "BM25 lexical", family: retrieval, tracks: [retrieval_only], pin: {kind: version, value: "1.1.0"}, eligibility: all}
  - {id: R1, name: "Dense", family: retrieval, tracks: [retrieval_only], pin: {kind: version, value: "1.1.0"}, eligibility: all}
  - {id: R2, name: "Hybrid RRF", family: retrieval, tracks: [retrieval_only, controlled_qa], pin: {kind: version, value: "1.1.0"}, eligibility: all}
  - {id: R3, name: "Hybrid plus reranker", family: retrieval, tracks: [retrieval_only, controlled_qa], pin: {kind: version, value: "1.1.0"}, eligibility: all}
  - {id: R4, name: "HippoRAG 2", family: graph_research, tracks: [retrieval_only], pin: {kind: commit, value: "d5c8329422e0a0b834a15874545cb6a74b4f9b26"}, eligibility: "document questions; a matched subset of the S tier under the owner's live limits (BADR-0031)"}
  - {id: R5, name: "GraphRAG Local", family: graph_research, tracks: [retrieval_only], pin: {kind: commit, value: "5faaaf4f5685fa2056fa8c3bf9342cb089f2942f"}, eligibility: "document questions; Global mode is a separate exploratory condition"}
  - {id: R6, name: "LightRAG", family: graph_research, tracks: [retrieval_only], pin: {kind: commit, value: "28ff1b05f2ac3f3e6fa14dd2cd33656579bd0c9c"}, eligibility: "document questions; a matched subset of the S tier under the owner's live limits (BADR-0031)"}
  - {id: R7, name: "Palladion retriever", family: system_under_test, tracks: [retrieval_only, controlled_qa], pin: {kind: unpinned, value: "UNPINNED"}, eligibility: all}
  - {id: R7a, name: "Palladion retriever without graph", family: system_under_test, tracks: [retrieval_only, controlled_qa], pin: {kind: commit, value: "caebd539492d48e478c418faa82778550fcd2658"}, eligibility: all}
  - {id: R7b, name: "Palladion retriever with bounded graph", family: system_under_test, tracks: [retrieval_only], pin: {kind: unpinned, value: "UNPINNED"}, eligibility: "FEATURE_NOT_SUPPORTED: the link route (PF07) exists since P10, but no graph store (OQ12) and no link-selection rule are in place (BR34)"}
  - {id: E0, name: "Plain LangChain two-step", family: framework, tracks: [native_end_to_end], pin: {kind: version, value: "1.6.7"}, eligibility: all}
  - {id: E1, name: "LangGraph agentic", family: framework, tracks: [native_end_to_end], pin: {kind: version, value: "1.2.14"}, eligibility: all}
  - {id: E2, name: "Google ADK with RAG Engine", family: managed_service, tracks: [native_end_to_end], pin: {kind: unpinned, value: "UNPINNED"}, eligibility: "NOT_RUN: no access configured and no probe approved (OQ07); FEATURE_NOT_SUPPORTED for the four-tool set and the principal filter even with access"}
  - {id: E3, name: "Palladion without critic", family: system_under_test, tracks: [native_end_to_end], pin: {kind: commit, value: "caebd539492d48e478c418faa82778550fcd2658"}, eligibility: "evaluator control B5 started by the evaluator-only launcher flag (BADR-0039); a distinct treatment: policy and operational claims need a review the gate does not get"}
  - {id: E4, name: "Full Palladion with critic", family: system_under_test, tracks: [native_end_to_end], pin: {kind: commit, value: "caebd539492d48e478c418faa82778550fcd2658"}, eligibility: "the default serving path with the critic on every message, started in evaluator mode for its report (BADR-0039)"}

